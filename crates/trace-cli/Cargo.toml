[package]
name = "trace-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "trace-cli"
path = "src/main.rs"

[dependencies]
trace-core = { path = "../trace-core" }
trace-mcp = { path = "../trace-mcp" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-util = "0.7"
anyhow = "1"
serde_json = "1"
